name: Python tests

on:
  push:
    branches:
      - main
      - 'research/**'
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q

  browser-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser module syntax
        run: |
          node --check web/save-reader.mjs
          node --check web/app.mjs
      - name: Test browser save parsing and portal graph
        run: node --test web/tests/*.test.mjs
