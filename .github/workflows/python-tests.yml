name: SM Atlas checks

on:
  push:
    branches:
      - main
      - 'research/**'
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q

  browser-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned SQLite WASM dependency
        run: npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - name: Verify Python and browser tile catalogs match
        run: python3 scripts/export_web_tile_catalog.py --check
      - name: Check browser source syntax
        run: |
          npm --prefix web run check
          node --check web/tunnel-reader.mjs
      - name: Test binary decoding with real SQLite WASM
        run: npm --prefix web test
      - name: Build self-hosted browser preview
        run: npm --prefix web run build
      - name: Verify static distribution
        run: |
          test -s web/dist/vendor/sql-wasm.js
          test -s web/dist/vendor/sql-wasm.wasm
          test -s web/dist/save-worker.js
          test -s web/dist/tunnel-reader.mjs
          test -s web/dist/tile-catalog.mjs
          test -s web/dist/THIRD_PARTY_NOTICES.md
          if grep -R 'cdn.jsdelivr.net' web/dist; then
            echo 'Unexpected external runtime URL in distribution'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sm-atlas-browser-preview
          path: web/dist/
          if-no-files-found: error
